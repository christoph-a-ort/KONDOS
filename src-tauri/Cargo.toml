[package]
name = "kondos"
version = "0.1.0"
description = "Erfassung, Visualisierung und Export von Ordner- und Dateistrukturen"
authors = ["Christoph"]
edition = "2021"
default-run = "kondos"
autobins = false

[lib]
name = "kondos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kondos"
path = "src/main.rs"

[[bin]]
name = "dotty_lock_test_helper"
path = "src/bin/dotty_lock_test_helper.rs"
required-features = ["lock-test-helper"]
test = false
bench = false
doc = false

[features]
lock-test-helper = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf-extract = "0.12"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
rust_xlsxwriter = "0.99"
genpdf = "0.2"
fs4 = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, damit catch_unwind eine Parser-Panic auffangen kann.
panic = "unwind"
strip = true
